<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>まさよしから逃げろ！</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<!-- Supabase JSクライアント（ビルド工程なしで使えるUMD版をCDNから読み込み）。
     "@2" のような範囲指定だと訪問時期や地域のCDNキャッシュ状況によって
     実際に配信されるバージョンが変わり得るため、動作確認済みの正確な
     バージョンに固定して全端末で同じビルドが読み込まれるようにする。 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>

<div id="app">

  <!-- タイトル画面 -->
  <div id="title-screen" class="screen">
    <!-- 装飾の「まさよし」（当たり判定なし・演出のみ） -->
    <div id="title-deco-back" aria-hidden="true"></div>
    <div id="title-player"></div>
    <div id="title-deco-front" aria-hidden="true"></div>

    <div id="title-content">
      <h1 id="title-text">まさよしから<br>逃げろ！</h1>

      <button id="start-btn"><span>スタート</span></button>

      <div id="controls-hint">
        <p class="controls-line"><span class="controls-tag">PC</span>WASD / 矢印キーで移動</p>
        <p class="controls-line"><span class="controls-tag">スマホ</span>画面を指でスライドして移動</p>
      </div>

      <p class="hint-text-small">まさよしに触れたら終わり。</p>

      <!-- ランキングTOP3（Supabase）。取得できない/0件の場合は#top3-statusにメッセージを出す -->
      <div id="title-ranking">
        <p class="ranking-top3-label">🏆 ランキング TOP3</p>
        <p id="top3-status" class="ranking-status">ランキング読み込み中…</p>
        <ol id="top3-list"></ol>
        <button id="open-ranking-btn" type="button">ランキングを見る</button>
      </div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-container" class="screen" hidden>
    <div id="hud">
      <span id="timer">0.00s</span>
    </div>

    <!-- プレイヤー：#player=位置(当たり判定の基準点)／#player-bob=走行時の上下揺れ／#player-sprite=画像と左右反転 -->
    <div id="player">
      <div id="player-bob">
        <div id="player-sprite"></div>
      </div>
    </div>

    <!-- 敵キャラ（「まさよし」）はJSで動的に生成してここに追加される -->

    <!-- 接触した瞬間の白フラッシュ（画面揺れは#game-containerに直接クラスを付けて行う） -->
    <div id="gameover-flash" aria-hidden="true"></div>

    <!-- ゲームオーバー演出一式 -->
    <div id="gameover-overlay" hidden>
      <div id="gameover-image"></div>

      <div id="gameover-don" aria-hidden="true">ドン！！</div>

      <p id="gameover-taunt"></p>

      <div id="gameover-bottom-scrim"></div>

      <div id="gameover-actions" hidden>
        <h2 id="gameover-label">GAME OVER</h2>
        <p id="survived-time">生存時間: 0.00秒</p>
        <button id="retry-btn">もう一度</button>
        <button id="back-to-title-btn">スタートに戻る</button>
      </div>
    </div>
  </div>

  <!-- 初回STARTだけ表示するプレイヤー名入力（以後はlocalStorageに保存され表示されない） -->
  <div id="name-modal-backdrop" hidden></div>
  <div id="name-modal" hidden>
    <div id="name-modal-box">
      <p id="name-modal-title">プレイヤー名を入力してね</p>
      <input id="name-input" type="text" maxlength="14" placeholder="なまえ" autocomplete="off" inputmode="text">
      <button id="name-confirm-btn" type="button">ケッテイ</button>
    </div>
  </div>

  <!-- ランキングパネル（下からせり上がる全順位表示） -->
  <div id="ranking-backdrop" hidden></div>
  <div id="ranking-panel" hidden>
    <div id="ranking-panel-header">
      <h2>ランキング</h2>
      <button id="ranking-close-btn" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="ranking-panel-body">
      <p id="ranking-status" class="ranking-status">読み込み中…</p>
      <ol id="ranking-full-list"></ol>
    </div>
  </div>

</div>

<script src="script.js?v=2"></script>
</body>
</html>
